<h1>Consulta Saldo</h1>
<header>
  <div class="atenuado">
    Último login: {{cliente.ultimoLogin | date}}
  </div>
  <div>
    <b>Cliente</b>: {{cliente.nome | uppercase}}
  </div>
  <div>
    <b>Saldo</b>:
    <span [class]="cliente.saldo | classPorValor">
      {{cliente.saldo | currency}}
    </span>
  </div>
  @if (cliente.creditoPreAprovado > 0) {
    <div>
      <b>Crédito pré-aprovado</b>:
      <span [class]="cliente.creditoPreAprovado | classPorValor:classesContextuais">
        {{cliente.creditoPreAprovado | currency}}
      </span>
    </div>
  }
</header>
